# PrefixPro Configuration
config-version: 3

# Message Settings
messages:
  prefix: "§c[!] "
  player_now_afk: "§fYou are now AFK"
  player_no_longer_afk: "§fYou are no longer AFK"
  player_no_permission: "You don't have permission to use this command!"
  player_console_only: "This command can only be used by players!"
  command_usage: "Usage: /prefixprob reload"
  command_plugin_reloaded: "§aPlugin reloaded!"
  join-leave-message: true

# Display Settings
display:
  tab: true
  chat: true
  nametag: true

rec:
  prefix: "§4[⏺] §f"

# AFK Settings
afk:
  # Time in seconds before auto-AFK (300 = 5 minutes)
  auto-time: 300
  # Suffix that appears when AFK
  suffix: " &7[⌚]"
  screen_title: "§cAFK"
  screen_subtitle: "§7Sneak To exit AFK"
  # Enable auto-AFK feature
  auto-enabled: true