# PrefixPro Configuration
config-version: 3

# Display Settings
display:
  tab: true
  chat: true
  nametag: true

# Message Settings
messages:
  prefix: "&8[&6PrefixPro&8] &7"
  join-leave-message:
    enabled: true

# AFK Settings
afk:
  # Time in seconds before auto-AFK (300 = 5 minutes)
  auto-time: 300
  # Suffix that appears when AFK
  suffix: " &7[AFK]"
  # Enable auto-AFK feature
  auto-enabled: true