name: PrefixProB
version: '${version}'
main: com.samvolvo.prefixPro.PrefixPro
api-version: '1.21'
prefix: PrefixProB
authors: [ SamVolvo, ybbbno ]
website: https://samvolvo.com
depend: []

commands:
  afk:
    description: Toggle AFK status
    usage: /afk
    permission: prefixprob.afk
  rec:
    description: Toggle REC status
    usage: /rec
    permission: prefixprob.rec
  prefixprob:
    description: Plugin management command
    usage: /prefixprob reload
    permission: prefixprob.admin

permissions:
  prefixprob.afk:
    description: Allows use of AFK features
    default: true
  prefixprob.admin:
    description: Allows use of admin commands
    default: op